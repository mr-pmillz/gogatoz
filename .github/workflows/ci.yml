name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'entrypoint.sh'
      - 'Dockerfile*'
      - 'internal/depxbridge/third_party/depx/**'
      - '.golangci-lint.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - 'entrypoint.sh'
      - 'Dockerfile*'
      - 'internal/depxbridge/third_party/depx/**'
      - '.golangci-lint.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o ./bin/gogatoz \
            ./main.go

      - name: Verify depx source snapshot
        run: python3 scripts/sync_depx.py --check

      - name: Test container entrypoint
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify versioned go install
        run: python3 scripts/check_go_install.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # ratchet:golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --config ./.golangci-lint.yml --timeout=5m

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes the test results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Add GOPATH bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@3cf14356a16c7931cfeacd7dfee585527618df3d # easter egg

      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          mkdir -p coverage
          gotestsum \
            --jsonfile coverage/gotest.json \
            --format pkgname \
            -- ./... -race -coverprofile=coverage/coverage.txt -covermode=atomic

      - name: Coverage summary
        run: |
          go tool cover -func=coverage/coverage.txt | tee coverage/coverage-summary.txt
          {
            echo "## Coverage Summary"
            echo ""
            echo '```'
            tail -n 1 coverage/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML coverage report
        run: go tool cover -html=coverage/coverage.txt -o coverage/coverage.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/coverage.txt
            coverage/coverage.html
            coverage/coverage-summary.txt
            coverage/gotest.json
          if-no-files-found: error

      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # ratchet:dorny/test-reporter@v3
        if: always()
        with:
          name: Go Tests
          path: coverage/gotest.json
          reporter: golang-json
          fail-on-error: false
