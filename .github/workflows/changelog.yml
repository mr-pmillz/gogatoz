name: Changelog

# Maintains the committed CHANGELOG.md ON the release branch so it lands on
# `main` as part of the release-PR merge — NOT as a separate post-merge push.
#
# Why: the old flow (a `changelog` job in release.yml) regenerated CHANGELOG.md
# AFTER the tag and pushed `chore: update changelog` straight to `main`. That
# commit superseded the release-merge commit before ci.yml's coverage job
# finished uploading its baseline — and the code-coverage action rejects a
# baseline that is no longer the latest commit on the branch. The
# changelog-only commit then never re-ran coverage, so `main` ended up with NO
# stored baseline and PR coverage comparisons showed "not yet available".
#
# Folding the changelog into the release branch makes the release-merge commit
# `main`'s final post-release HEAD, so ci.yml's coverage job runs on it and the
# baseline is stored and never superseded.
#
# GoReleaser still owns the GitHub Release notes (release.yml feeds it
# RELEASE_CHANGELOG.md via `git-cliff --latest`); this workflow only maintains
# the in-repo CHANGELOG.md file.

on:
  push:
    branches:
      - 'release/v*'
      - 'hotfix/v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Update CHANGELOG.md on release branch
    runs-on: ubuntu-latest
    if: >-
      github.event.head_commit.message != 'chore: update changelog'
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive release version from branch name
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${BRANCH#release/}"
          VERSION="${VERSION#hotfix/}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not derive a semver tag from branch '$BRANCH' (parsed '$VERSION'). Use release/vX.Y.Z or hotfix/vX.Y.Z."
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.GOGATOZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.GOGATOZ_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # ratchet:orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.ver.outputs.tag }} --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit verified CHANGELOG.md if changed
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi

          # Build the new Git objects through the API. Creating the commit with
          # a GitHub App installation token makes GitHub sign it for the App.
          PARENT_SHA="$(git rev-parse HEAD)"
          BASE_TREE_SHA="$(git rev-parse "${PARENT_SHA}^{tree}")"
          BLOB_SHA="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
              -F 'content=@CHANGELOG.md' \
              -f 'encoding=utf-8' \
              --jq '.sha'
          )"
          TREE_SHA="$(
            jq -n \
              --arg base_tree "$BASE_TREE_SHA" \
              --arg blob_sha "$BLOB_SHA" \
              '{
                base_tree: $base_tree,
                tree: [{
                  path: "CHANGELOG.md",
                  mode: "100644",
                  type: "blob",
                  sha: $blob_sha
                }]
              }' |
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" \
                --input - \
                --jq '.sha'
          )"
          COMMIT_RESPONSE="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" \
              -f 'message=chore: update changelog' \
              -f "tree=${TREE_SHA}" \
              -f "parents[]=${PARENT_SHA}"
          )"
          COMMIT_SHA="$(jq -er '.sha' <<<"$COMMIT_RESPONSE")"

          if ! jq -e \
            '.verification.verified == true and .verification.reason == "valid"' \
            <<<"$COMMIT_RESPONSE" >/dev/null; then
            REASON="$(jq -r '.verification.reason // "missing"' <<<"$COMMIT_RESPONSE")"
            echo "::error::GitHub did not return a valid signature for commit ${COMMIT_SHA} (reason: ${REASON}); branch not updated."
            exit 1
          fi

          # Never overwrite a commit that landed while the changelog was being
          # generated. force=false permits only a fast-forward ref update.
          UPDATED_SHA="$(
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f "sha=${COMMIT_SHA}" \
              -F 'force=false' \
              --jq '.object.sha'
          )"
          if [[ "$UPDATED_SHA" != "$COMMIT_SHA" ]]; then
            echo "::error::Branch update returned ${UPDATED_SHA}; expected ${COMMIT_SHA}."
            exit 1
          fi

          echo "::notice::Created verified changelog commit ${COMMIT_SHA} on ${BRANCH}."
